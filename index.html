<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17121B">
  <title>Mi Cocina</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <style>
    :root {
      --fondo: #17121B;
      --superficie: #221A29;
      --superficie-alta: #2B2133;
      --borde: #3A2E44;
      --texto: #F5EFEA;
      --texto-suave: #B7A8B5;
      --principal: #F2996B;
      --principal-oscuro: #D97B4C;
      --principal-suave: rgba(242, 153, 107, .14);
      --ciruela: #6D3B5E;
      --ciruela-suave: rgba(109, 59, 94, .35);
      --verde: #7FC8A9;
      --peligro: #E1705C;
      --peligro-suave: rgba(225, 112, 92, .16);
      --sombra: 0 18px 44px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% -10%, rgba(242, 153, 107, .14), transparent 45%),
        radial-gradient(circle at -10% 10%, rgba(109, 59, 94, .28), transparent 42%),
        var(--fondo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      padding-bottom: 116px;
      -webkit-font-smoothing: antialiased;
    }

    .cabecera {
      padding: 34px 24px 12px;
    }

    .saludo {
      margin: 0;
      color: var(--texto-suave);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    h1 {
      margin: 6px 0 0;
      font-size: 38px;
      font-weight: 850;
      letter-spacing: -.9px;
    }

    h2 {
      margin: 14px 0 18px;
      font-size: 28px;
      font-weight: 820;
      letter-spacing: -.6px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 760;
    }

    .contenido {
      padding: 14px 20px 30px;
      animation: aparecer .25s ease both;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tarjeta {
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 26px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--sombra);
      transition: transform .16s ease, border-color .16s ease;
    }

    .tarjeta:active {
      transform: scale(.985);
    }

    .tarjeta-destacada {
      background:
        linear-gradient(145deg, rgba(242, 153, 107, .16), rgba(109, 59, 94, .22)),
        var(--superficie);
      border-color: rgba(242, 153, 107, .28);
    }

    .comida-siguiente {
      background:
        linear-gradient(135deg, rgba(242, 153, 107, .22), rgba(109, 59, 94, .30)),
        var(--superficie-alta);
      border: 1px solid rgba(242, 153, 107, .30);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: var(--sombra);
    }

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--principal-suave);
      color: var(--principal);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .comida-siguiente h3 {
      margin: 14px 0 6px;
      font-size: 26px;
      font-weight: 820;
      letter-spacing: -.5px;
    }

    .comida-siguiente p {
      margin: 0 0 18px;
      color: var(--texto-suave);
    }

    .comida-hoy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--borde);
    }

    .comida-hoy:last-child {
      border-bottom: none;
    }

    .comida-hoy strong {
      display: block;
      font-size: 16px;
    }

    .comida-hoy span {
      font-size: 13px;
      color: var(--texto-suave);
    }

    .estado {
      font-size: 12px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--ciruela-suave);
      color: #E7C6DC;
      white-space: nowrap;
    }

    .estado.cocinada {
      background: rgba(127, 200, 169, .16);
      color: var(--verde);
    }

    .boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 15px 20px;
      border: none;
      border-radius: 18px;
      background: var(--principal);
      color: #241712;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .boton:active {
      transform: scale(.97);
      background: var(--principal-oscuro);
    }

    .boton.secundario {
      background: var(--superficie-alta);
      color: var(--texto);
      border: 1px solid var(--borde);
    }

    .boton.secundario:active {
      background: #332840;
    }

    .boton-peligro {
      min-height: 42px;
      padding: 9px 14px;
      border: none;
      border-radius: 14px;
      background: var(--peligro-suave);
      color: var(--peligro);
      font-weight: 800;
      transition: transform .15s ease;
    }

    .boton-peligro:active {
      transform: scale(.95);
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 780;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    input,
    select,
    textarea {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: 1.5px solid var(--borde);
      border-radius: 18px;
      background: var(--superficie-alta);
      color: var(--texto);
      font-size: 16px;
      font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--principal);
      box-shadow: 0 0 0 4px rgba(242, 153, 107, .16);
    }

    button[type="submit"] {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 18px;
      background: var(--principal);
      color: #241712;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button[type="submit"]:active {
      transform: scale(.98);
      background: var(--principal-oscuro);
    }

    .navegacion {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 9px;
      background: rgba(34, 26, 41, .88);
      backdrop-filter: blur(24px);
      border: 1px solid var(--borde);
      border-radius: 28px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, .45);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 58px;
      border-radius: 20px;
      color: var(--texto-suave);
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item:active {
      transform: scale(.94);
    }

    .nav-item.activa {
      background: var(--principal-suave);
      color: var(--principal);
    }

    .resumen-datos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .resumen-datos div {
      background: rgba(23, 18, 27, .55);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
    }

    .resumen-datos strong {
      display: block;
      font-size: 24px;
      color: var(--principal);
    }

    .resumen-datos span {
      font-size: 11px;
      font-weight: 750;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .semana {
      display: grid;
      gap: 12px;
    }

    .dia-semana {
      border: 1px solid var(--borde);
      border-radius: 22px;
      padding: 16px;
      background: var(--superficie);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }

    .dia-semana:active {
      transform: scale(.98);
    }

    .dia-semana.hoy {
      border-color: rgba(242, 153, 107, .55);
      background:
        linear-gradient(145deg, rgba(242, 153, 107, .10), transparent),
        var(--superficie);
    }

    .dia-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .dia-nombre {
      font-weight: 820;
    }

    .dia-fecha {
      font-size: 13px;
      color: var(--texto-suave);
    }

    .comida-linea {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      padding: 5px 0;
    }

    .comida-linea span:first-child {
      color: var(--texto-suave);
      font-weight: 750;
    }

    .favorito {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--superficie-alta);
      border: 1px solid var(--borde);
      border-radius: 999px;
      font-size: 19px;
      cursor: pointer;
      color: var(--texto-suave);
      transition: transform .15s ease, color .15s ease, border-color .15s ease;
    }

    .favorito.activo {
      color: var(--principal);
      border-color: rgba(242, 153, 107, .45);
      background: var(--principal-suave);
    }

    .favorito:active {
      transform: scale(.9);
    }

    .filtros {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .filtros::-webkit-scrollbar {
      display: none;
    }

    .filtro {
      min-height: 44px;
      padding: 11px 17px;
      border-radius: 999px;
      border: 1.5px solid var(--borde);
      background: var(--superficie);
      color: var(--texto-suave);
      font-weight: 780;
      font-size: 14px;
      white-space: nowrap;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }

    .filtro:active {
      transform: scale(.95);
    }

    .filtro.activo {
      background: var(--principal);
      border-color: var(--principal);
      color: #241712;
    }

    .filtro-nueva {
      background: var(--principal);
      border-color: var(--principal);
      color: #241712;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--superficie-alta);
      border: 1px solid var(--borde);
      color: var(--texto-suave);
      font-size: 12px;
      font-weight: 750;
    }

    .producto {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--borde);
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto-fila {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-weight: 650;
      text-transform: none;
      color: var(--texto);
    }

    .producto-fila input {
      width: 26px;
      height: 26px;
      margin: 0;
      accent-color: var(--principal);
    }

    .anadir-producto {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .oculto {
      display: none;
    }

    .modal-fondo {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(12, 8, 16, .68);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      animation: aparecerFondo .2s ease both;
    }

    .modal-fondo.oculto {
      display: none;
    }

    .modal {
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-bottom: none;
      border-radius: 30px 30px 0 0;
      padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
      box-shadow: 0 -20px 50px rgba(0, 0, 0, .5);
      animation: subirModal .25s ease both;
    }

    @keyframes aparecerFondo {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes subirModal {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal h2 {
      margin: 0;
      font-size: 23px;
    }

    .modo-cocina {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 80% 0%, rgba(242, 153, 107, .12), transparent 45%),
        #14101A;
      padding: calc(26px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .modo-cocina.oculto {
      display: none;
    }

    .modo-cocina-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modo-cocina h2 {
      margin: 0;
      font-size: 23px;
    }

    .progreso-cocina {
      height: 6px;
      border-radius: 999px;
      background: var(--superficie-alta);
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progreso-cocina div {
      height: 100%;
      background: var(--principal);
      border-radius: 999px;
      transition: width .25s ease;
    }

    .paso-actual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 31px;
      font-weight: 830;
      line-height: 1.25;
      padding: 34px 0;
    }

    .paso-numero {
      font-size: 13px;
      font-weight: 850;
      color: var(--principal);
      text-transform: uppercase;
      letter-spacing: .12em;
      text-align: center;
      margin-bottom: 12px;
    }

    .controles-cocina {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .selector-raciones {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .selector-raciones strong {
      font-size: 21px;
    }

    .boton-racion {
      min-width: 50px;
      min-height: 50px;
      border: none;
      border-radius: 17px;
      background: var(--principal-suave);
      color: var(--principal);
      font-size: 23px;
      font-weight: 850;
      transition: transform .15s ease;
    }

    .boton-racion:active {
      transform: scale(.92);
    }

    @media (max-width: 480px) {
      .anadir-producto {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <p class="saludo">Hola, Judit</p>
    <h1>Mi Cocina</h1>
  </header>

  <main class="contenido">
    <section id="pantalla-hoy">
      <div id="comida-siguiente"></div>

      <div class="tarjeta">
        <h3>Tu día</h3>
        <div id="comidas-hoy"></div>
      </div>

      <div class="tarjeta tarjeta-destacada">
        <h3>Esta semana</h3>
        <div class="resumen-datos">
          <div>
            <strong id="comidas-planificadas">0</strong>
            <span>Comidas</span>
          </div>
          <div>
            <strong id="proteina-semana">0 g</strong>
            <span>Proteína</span>
          </div>
        </div>
      </div>
    </section>

    <section id="pantalla-recetas" class="oculto">
      <h2>Mis recetas</h2>

      <div class="filtros">
        <button class="filtro activo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="favoritas">Favoritas</button>
        <button class="filtro" data-filtro="Desayuno">Desayuno</button>
        <button class="filtro" data-filtro="Comida">Comida</button>
        <button class="filtro" data-filtro="Cena">Cena</button>
        <button class="filtro filtro-nueva" id="boton-nueva-receta">+ Nueva</button>
      </div>

      <div id="lista-recetas"></div>
    </section>

    <section id="pantalla-menu" class="oculto">
      <h2>Menú semanal</h2>

      <div class="tarjeta">
        <label>Elige un día
          <input type="date" id="fecha-menu">
        </label>
      </div>

      <div id="resumen-menu" class="tarjeta tarjeta-destacada oculto">
        <h3 id="titulo-semana"></h3>

        <div class="resumen-datos">
          <div>
            <strong id="resumen-comidas">0</strong>
            <span>Comidas</span>
          </div>

          <div>
            <strong id="resumen-calorias">0</strong>
            <span>kcal</span>
          </div>

          <div>
            <strong id="resumen-proteina">0 g</strong>
            <span>Proteína</span>
          </div>

          <div>
            <strong id="resumen-media">0 g</strong>
            <span>Proteína/día</span>
          </div>
        </div>
      </div>

      <div id="vista-semana"></div>
    </section>

    <section id="pantalla-compra" class="oculto">
      <h2>Lista de compra</h2>

      <div class="tarjeta">
        <label>Elige un día
          <input type="date" id="fecha-compra">
        </label>
      </div>

      <div id="contenido-compra"></div>
    </section>
  </main>

  <nav class="navegacion">
    <a href="#" class="nav-item activa" data-pantalla="hoy">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      Hoy
    </a>

    <a href="#" class="nav-item" data-pantalla="recetas">
      <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2Z"/><path d="M19 17H6a2 2 0 0 0-2 2"/><path d="M9 7h6"/></svg>
      Recetas
    </a>

    <a href="#" class="nav-item" data-pantalla="menu">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Menú
    </a>

    <a href="#" class="nav-item" data-pantalla="compra">
      <svg viewBox="0 0 24 24"><path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4Z"/><path d="M4 6h16"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Compra
    </a>
  </nav>

  <div id="modal-receta" class="modal-fondo oculto">
    <div class="modal">
      <div class="modal-cabecera">
        <h2>Nueva receta</h2>
        <button class="boton-peligro" id="cerrar-modal-receta">Cerrar</button>
      </div>

      <form id="formulario-receta">
        <label>Nombre
          <input id="receta-nombre" required>
        </label>

        <label>Tipo
          <select id="receta-tipo">
            <option>Desayuno</option>
            <option>Comida</option>
            <option>Cena</option>
          </select>
        </label>

        <label>Calorías
          <input id="receta-calorias" type="number" min="0">
        </label>

        <label>Proteína en gramos
          <input id="receta-proteina" type="number" min="0">
        </label>

        <label>Ingredientes
          <textarea
            id="receta-ingredientes"
            rows="5"
            placeholder="Pechuga de pollo | 180 | g"
          ></textarea>
        </label>

        <label>Pasos
          <textarea
            id="receta-pasos"
            rows="6"
            placeholder="Un paso por línea"
          ></textarea>
        </label>

        <button type="submit">Guardar receta</button>
      </form>
    </div>
  </div>

  <div id="modal-dia" class="modal-fondo oculto">
    <div class="modal">
      <div class="modal-cabecera">
        <h2 id="titulo-modal-dia">Editar día</h2>
        <button class="boton-peligro" id="cerrar-modal-dia">Cerrar</button>
      </div>

      <form id="formulario-dia">
        <div id="campos-dia"></div>

    function cargarDatos(clave, valorInicial) {
      const datos = localStorage.getItem(clave);
      return datos ? JSON.parse(datos) : valorInicial;
    }

    function guardarDatos(clave, datos) {
      localStorage.setItem(clave, JSON.stringify(datos));
    }

    function obtenerSemanaISO(fechaTexto) {
      const fecha = new Date(fechaTexto + "T12:00:00");
      const temporal = new Date(
        Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate())
      );

      const dia = temporal.getUTCDay() || 7;
      temporal.setUTCDate(temporal.getUTCDate() + 4 - dia);

      const inicioAno = new Date(Date.UTC(temporal.getUTCFullYear(), 0, 1));
      const semana = Math.ceil(
        (((temporal - inicioAno) / 86400000) + 1) / 7
      );

      return `${temporal.getUTCFullYear()}-W${String(semana).padStart(2, "0")}`;
    }

    function obtenerFechaISO(fecha) {
      return fecha.toLocaleDateString("sv-SE");
    }

    function obtenerInicioSemana(fechaTexto) {
      const fecha = new Date(fechaTexto + "T12:00:00");
      const dia = fecha.getDay();
      const diferencia = dia === 0 ? -6 : 1 - dia;

      fecha.setDate(fecha.getDate() + diferencia);
      return fecha;
    }

    function mostrarPantalla(nombre) {
      ["hoy", "recetas", "menu", "compra"].forEach(pantalla => {
        document
          .getElementById(`pantalla-${pantalla}`)
          .classList.toggle("oculto", pantalla !== nombre);
      });

      document.querySelectorAll(".nav-item").forEach(enlace => {
        enlace.classList.toggle(
          "activa",
          enlace.dataset.pantalla === nombre
        );
      });

      const contenido = document.querySelector(".contenido");
      contenido.style.animation = "none";
      contenido.offsetHeight;
      contenido.style.animation = "";

      if (nombre === "hoy") renderizarHoy();
      if (nombre === "recetas") renderizarRecetas();
      if (nombre === "menu") renderizarMenu();
      if (nombre === "compra") renderizarCompra();
    }

    function obtenerComidaDelDia(fechaISO, comida) {
      const semana = obtenerSemanaISO(fechaISO);
      const menu = menus[semana] || {};
      const nombresDias = [
        "Domingo",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado"
      ];

      const nombreDia = nombresDias[new Date(fechaISO + "T12:00:00").getDay()];
      const recetaId = menu[`${nombreDia}-${comida}`];

      return recetas.find(receta => receta.id === recetaId);
    }

    function renderizarHoy() {
      const contenedorSiguiente = document.getElementById("comida-siguiente");
      const contenedor = document.getElementById("comidas-hoy");
      const fechaHoy = obtenerFechaISO(new Date());
      const semana = obtenerSemanaISO(fechaHoy);
      const menu = menus[semana] || {};

      const tipos = ["Desayuno", "Comida", "Cena"];
      const comidasHoy = tipos.map(comida => ({
        comida,
        receta: obtenerComidaDelDia(fechaHoy, comida)
      }));

      const siguiente = comidasHoy.find(item => item.receta);

      contenedorSiguiente.innerHTML = "";

      if (siguiente) {
        contenedorSiguiente.className = "comida-siguiente";
        const clave = `${siguiente.comida}-${fechaHoy}`;
        const cocinada = localStorage.getItem(`cocinada-${clave}`) === "true";

        contenedorSiguiente.innerHTML = `
          <span class="etiqueta">Siguiente: ${siguiente.comida}</span>
          <h3>${siguiente.receta.nombre}</h3>
          <p>${siguiente.receta.calorias} kcal · ${siguiente.receta.proteina} g proteína</p>
        `;

        const boton = document.createElement("button");
        boton.className = cocinada ? "boton secundario" : "boton";
        boton.textContent = cocinada
          ? "Marcar como pendiente"
          : "Cocinar esta comida";

        boton.onclick = () => {
          localStorage.setItem(`cocinada-${clave}`, !cocinada);
          renderizarHoy();
        };

        contenedorSiguiente.appendChild(boton);
      } else {
        contenedorSiguiente.className = "tarjeta tarjeta-destacada";
        contenedorSiguiente.innerHTML = `
          <span class="etiqueta">Hoy</span>
          <h3>Aún no has planificado comidas</h3>
          <p>Elige una receta y organiza tu día en menos de un minuto.</p>
        `;

        const boton = document.createElement("button");
        boton.className = "boton";
        boton.textContent = "Ir a mis recetas";

        boton.onclick = () => mostrarPantalla("recetas");
        contenedorSiguiente.appendChild(boton);
      }

      contenedor.innerHTML = "";

      comidasHoy.forEach(item => {
        const clave = `${item.comida}-${fechaHoy}`;
        const cocinada = localStorage.getItem(`cocinada-${clave}`) === "true";

        const fila = document.createElement("div");
        fila.className = "comida-hoy";

        fila.innerHTML = `
          <div>
            <strong>${item.comida}</strong>
            <span>${item.receta ? item.receta.nombre : "Sin planificar"}</span>
          </div>
          <span class="estado ${cocinada ? "cocinada" : ""}">
            ${cocinada ? "Cocinada" : "Pendiente"}
          </span>
        `;

        contenedor.appendChild(fila);
      });

      let proteinaTotal = 0;
      let comidasPlanificadas = 0;

      Object.values(menu).forEach(recetaId => {
        const receta = recetas.find(receta => receta.id === recetaId);

        if (receta) {
          proteinaTotal += receta.proteina;
          comidasPlanificadas += 1;
        }
      });

      document.getElementById("comidas-planificadas").textContent =
        comidasPlanificadas;

      document.getElementById("proteina-semana").textContent =
        `${proteinaTotal} g`;
    }

    function renderizarRecetas() {
      const contenedor = document.getElementById("lista-recetas");
      contenedor.innerHTML = "";

      const recetasFiltradas = recetas.filter(receta => {
        if (filtroActual === "todas") return true;
        if (filtroActual === "favoritas") return receta.favorita;
        return receta.tipo === filtroActual;
      });

      recetasFiltradas.forEach(receta => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        tarjeta.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <div>
              <span class="etiqueta">${receta.tipo}</span>
              <h3 style="margin:12px 0 8px;">${receta.nombre}</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="chip">${receta.calorias} kcal</span>
                <span class="chip">${receta.proteina} g proteína</span>
              </div>
            </div>
            <button class="favorito ${receta.favorita ? "activo" : ""}">
              ${receta.favorita ? "♥" : "♡"}
            </button>
          </div>
        `;

        tarjeta.querySelector(".favorito").onclick = () => {
          receta.favorita = !receta.favorita;
          guardarDatos(CLAVE_RECETAS, recetas);
          renderizarRecetas();
        };

        const botonCocinar = document.createElement("button");
        botonCocinar.className = "boton";
        botonCocinar.textContent = "Cocinar";

        botonCocinar.onclick = () => abrirModoCocina(receta);

        tarjeta.appendChild(botonCocinar);
        contenedor.appendChild(tarjeta);
      });

      if (!recetasFiltradas.length) {
        contenedor.innerHTML = "<p>No hay recetas en este filtro.</p>";
      }
    }

    document.querySelectorAll(".filtro").forEach(boton => {
      boton.onclick = () => {
        if (boton.id === "boton-nueva-receta") {
          abrirModalReceta();
          return;
        }

        document.querySelectorAll(".filtro").forEach(filtro => {
          if (filtro.id !== "boton-nueva-receta") {
            filtro.classList.remove("activo");
          }
        });

        boton.classList.add("activo");
        filtroActual = boton.dataset.filtro;
        renderizarRecetas();
      };
    });

    function abrirModalReceta() {
      document.getElementById("modal-receta").classList.remove("oculto");
    }

    function cerrarModalReceta() {
      document.getElementById("modal-receta").classList.add("oculto");
    }

    document.getElementById("boton-nueva-receta").onclick = abrirModalReceta;
    document.getElementById("cerrar-modal-receta").onclick = cerrarModalReceta;

    document
      .getElementById("formulario-receta")
      .addEventListener("submit", evento => {
        evento.preventDefault();

        const nombre = document.getElementById("receta-nombre").value.trim();
        const tipo = document.getElementById("receta-tipo").value;
        const calorias =
          Number(document.getElementById("receta-calorias").value) || 0;
        const proteina =
          Number(document.getElementById("receta-proteina").value) || 0;
        const ingredientesTexto = document
          .getElementById("receta-ingredientes")
          .value.trim();
        const pasosTexto = document
          .getElementById("receta-pasos")
          .value.trim();

        if (!nombre || !ingredientesTexto) return;

        const ingredientes = ingredientesTexto
          .split("\n")
          .map(linea => {
            const partes = linea.split("|").map(valor => valor.trim());

            return {
              nombre: partes[0],
              cantidad: Number(partes[1]) || 1,
              unidad: partes[2] || "ud",
              categoria: "Otros"
            };
          })
          .filter(ingrediente => ingrediente.nombre);

        const pasos = pasosTexto
          ? pasosTexto.split("\n").filter(paso => paso.trim())
          : ["Prepara los ingredientes.", "Cocina y sirve."];

        recetas.push({
          id: Date.now(),
          nombre,
          tipo,
          calorias,
          proteina,
          favorita: false,
          racionesBase: 1,
          ingredientes,
          pasos
        });

        guardarDatos(CLAVE_RECETAS, recetas);
        evento.target.reset();
        cerrarModalReceta();
        renderizarRecetas();
      });

    function abrirModoCocina(receta) {
      recetaCocinando = receta;
      pasoActual = 0;
      racionesActuales = receta.racionesBase || 1;

      document.getElementById("modo-cocina").classList.remove("oculto");
      renderizarModoCocina();
    }

    function cerrarModoCocina() {
      document.getElementById("modo-cocina").classList.add("oculto");
      recetaCocinando = null;
      pasoActual = 0;
    }

    function renderizarModoCocina() {
      const contenedor = document.getElementById("modo-cocina");
      const receta = recetaCocinando;
      const factor = racionesActuales / (receta.racionesBase || 1);

      const pasos = receta.pasos && receta.pasos.length
        ? receta.pasos
        : ["Prepara los ingredientes.", "Cocina y sirve."];

      const paso = pasos[pasoActual];
      const progreso = ((pasoActual + 1) / pasos.length) * 100;

      contenedor.innerHTML = `
        <div class="modo-cocina-cabecera">
          <h2>${receta.nombre}</h2>
          <button class="boton-peligro" id="cerrar-cocina">Cerrar</button>
        </div>

        <div class="progreso-cocina">
          <div style="width:${progreso}%;"></div>
        </div>

        <div class="selector-raciones">
          <div>
            <span style="font-size:12px;color:var(--texto-suave);font-weight:800;text-transform:uppercase;letter-spacing:.08em;">
              Raciones
            </span>
            <strong>${racionesActuales}</strong>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="boton-racion" id="menos-raciones">−</button>
            <button class="boton-racion" id="mas-raciones">+</button>
          </div>
        </div>

        <div class="paso-numero">
          Paso ${pasoActual + 1} de ${pasos.length}
        </div>

        <div class="paso-actual">${paso}</div>

        <div class="tarjeta">
          <h3>Ingredientes para ${racionesActuales} ración${racionesActuales === 1 ? "" : "es"}</h3>
          <div id="ingredientes-cocina"></div>
        </div>

        <div class="controles-cocina">
          <button class="boton secundario" id="paso-anterior">Anterior</button>
          <button class="boton" id="paso-siguiente">
            ${pasoActual === pasos.length - 1 ? "Terminar" : "Siguiente"}
          </button>
        </div>
      `;

      const contenedorIngredientes =
        document.getElementById("ingredientes-cocina");

      receta.ingredientes.forEach(ingrediente => {
        const fila = document.createElement("div");
        fila.className = "comida-linea";

        const cantidadAjustada = ingrediente.cantidad * factor;
        const cantidadTexto = Number.isInteger(cantidadAjustada)
          ? cantidadAjustada
          : cantidadAjustada.toFixed(1);

        fila.innerHTML = `
          <span>${ingrediente.nombre}</span>
          <span>${cantidadTexto} ${ingrediente.unidad}</span>
        `;

        contenedorIngredientes.appendChild(fila);
      });

      document.getElementById("cerrar-cocina").onclick = cerrarModoCocina;

      document.getElementById("menos-raciones").onclick = () => {
        if (racionesActuales > 1) {
          racionesActuales -= 1;
          renderizarModoCocina();
        }
      };

      document.getElementById("mas-raciones").onclick = () => {
        if (racionesActuales < 8) {
          racionesActuales += 1;
          renderizarModoCocina();
        }
      };

      document.getElementById("paso-anterior").onclick = () => {
        if (pasoActual > 0) {
          pasoActual -= 1;
          renderizarModoCocina();
        }
      };

      document.getElementById("paso-siguiente").onclick = () => {
        if (pasoActual < pasos.length - 1) {
          pasoActual += 1;
          renderizarModoCocina();
        } else {
          cerrarModoCocina();
        }
      };
    }

    function renderizarMenu() {
      const fechaInput = document.getElementById("fecha-menu");
      const vistaSemana = document.getElementById("vista-semana");
      const resumen = document.getElementById("resumen-menu");

      fechaInput.onchange = () => {
        if (fechaInput.value) renderizarMenu();
      };

      const fecha = fechaInput.value;

      if (!fecha) {
        vistaSemana.innerHTML = "";
        resumen.classList.add("oculto");
        return;
      }

      const semana = obtenerSemanaISO(fecha);
      const menu = menus[semana] || {};
      const inicioSemana = obtenerInicioSemana(fecha);

      document.getElementById("titulo-semana").textContent =
        `Semana ${semana}`;

      let calorias = 0;
      let proteina = 0;
      let numeroComidas = 0;

      Object.values(menu).forEach(recetaId => {
        const receta = recetas.find(receta => receta.id === recetaId);

        if (receta) {
          calorias += receta.calorias;
          proteina += receta.proteina;
          numeroComidas += 1;
        }
      });

      document.getElementById("resumen-comidas").textContent = numeroComidas;
      document.getElementById("resumen-calorias").textContent = calorias;
      document.getElementById("resumen-proteina").textContent = `${proteina} g`;
      document.getElementById("resumen-media").textContent =
        `${(proteina / 7).toFixed(1)} g`;

      resumen.classList.remove("oculto");

      vistaSemana.innerHTML = "";
      const contenedorSemana = document.createElement("div");
      contenedorSemana.className = "semana";

      const nombresDias = [
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado",
        "Domingo"
      ];

      const tiposComida = ["Desayuno", "Comida", "Cena"];
      const fechaHoy = obtenerFechaISO(new Date());

      nombresDias.forEach((nombreDia, indice) => {
        const fechaDia = new Date(inicioSemana);
        fechaDia.setDate(fechaDia.getDate() + indice);
        const fechaISO = obtenerFechaISO(fechaDia);

        const tarjetaDia = document.createElement("div");
        tarjetaDia.className = `dia-semana ${fechaISO === fechaHoy ? "hoy" : ""}`;

        tarjetaDia.innerHTML = `
          <div class="dia-cabecera">
            <span class="dia-nombre">${nombreDia}</span>
            <span class="dia-fecha">${fechaISO}</span>
          </div>
        `;

        tiposComida.forEach(comida => {
          const receta = recetas.find(
            receta => receta.id === menu[`${nombreDia}-${comida}`]
          );

          const linea = document.createElement("div");
          linea.className = "comida-linea";

          linea.innerHTML = `
            <span>${comida}</span>
            <span>${receta ? receta.nombre : "—"}</span>
          `;

          tarjetaDia.appendChild(linea);
        });

        tarjetaDia.onclick = () => {
          abrirModalDia(nombreDia, semana, menu);
        };

        contenedorSemana.appendChild(tarjetaDia);
      });

      vistaSemana.appendChild(contenedorSemana);
    }

    function abrirModalDia(nombreDia, semana, menu) {
      diaEditando = nombreDia;
      semanaEditando = semana;

      document.getElementById("titulo-modal-dia").textContent =
        `Editar ${nombreDia}`;

      const contenedor = document.getElementById("campos-dia");
      contenedor.innerHTML = "";

      ["Desayuno", "Comida", "Cena"].forEach(comida => {
        const clave = `${nombreDia}-${comida}`;
        const seleccionada = menu[clave] || "";

        const label = document.createElement("label");
        label.textContent = comida;

        const select = document.createElement("select");
        select.dataset.clave = clave;

        const opcionVacia = document.createElement("option");
        opcionVacia.value = "";
        opcionVacia.textContent = "Sin planificar";
        select.appendChild(opcionVacia);

        recetas.forEach(receta => {
          const opcion = document.createElement("option");
          opcion.value = receta.id;
          opcion.textContent = receta.nombre;

          if (receta.id === seleccionada) {
            opcion.selected = true;
          }

          select.appendChild(opcion);
        });

        label.appendChild(select);
        contenedor.appendChild(label);
      });

      document.getElementById("modal-dia").classList.remove("oculto");
    }

    function cerrarModalDia() {
      document.getElementById("modal-dia").classList.add("oculto");
      diaEditando = null;
      semanaEditando = null;
    }

    document.getElementById("cerrar-modal-dia").onclick = cerrarModalDia;

    document
      .getElementById("formulario-dia")
      .addEventListener("submit", evento => {
        evento.preventDefault();

        if (!diaEditando || !semanaEditando) return;

        const menu = menus[semanaEditando] || {};

        document
          .getElementById("campos-dia")
          .querySelectorAll("select")
          .forEach(select => {
            const clave = select.dataset.clave;

            if (select.value) {
              menu[clave] = Number(select.value);
            } else {
              delete menu[clave];
            }
          });

        menus[semanaEditando] = menu;
        guardarDatos(CLAVE_MENUS, menus);

        cerrarModalDia();
        renderizarMenu();
      });

    function renderizarCompra() {
      const fechaInput = document.getElementById("fecha-compra");
      const contenedor = document.getElementById("contenido-compra");

      fechaInput.onchange = () => {
        if (fechaInput.value) renderizarCompra();
      };

      const fecha = fechaInput.value;

      if (!fecha) {
        contenedor.innerHTML = "";
        return;
      }

      const semana = obtenerSemanaISO(fecha);
      const menu = menus[semana] || {};
      const claveCompra = `compra-${semana}`;

      if (!compras[claveCompra]) {
        const productos = {};

        Object.values(menu).forEach(recetaId => {
          const receta = recetas.find(receta => receta.id === recetaId);

          if (!receta) return;

          receta.ingredientes.forEach(ingrediente => {
            const clave = `${ingrediente.nombre}-${ingrediente.unidad}`;

            if (!productos[clave]) {
              productos[clave] = {
                nombre: ingrediente.nombre,
                cantidad: 0,
                unidad: ingrediente.unidad,
                categoria: ingrediente.categoria,
                comprado: false
              };
            }

            productos[clave].cantidad += ingrediente.cantidad;
          });
        });

        compras[claveCompra] = Object.values(productos);
        guardarDatos(CLAVE_COMPRAS, compras);
      }

      const productos = compras[claveCompra];
      const categorias = {};

      productos.forEach((producto, indice) => {
        if (!categorias[producto.categoria]) {
          categorias[producto.categoria] = [];
        }

        categorias[producto.categoria].push({
          ...producto,
          indice
        });
      });

      contenedor.innerHTML = `
        <form id="anadir-producto" class="tarjeta">
          <input type="hidden" value="${semana}" id="semana-compra">

          <div class="anadir-producto">
            <label>Producto
              <input id="producto-nombre" required>
            </label>

            <label>Cantidad
              <input
                id="producto-cantidad"
                type="number"
                step="0.1"
                min="0"
                value="1"
              >
            </label>

            <label>Unidad
              <select id="producto-unidad">
                <option value="ud">ud</option>
                <option value="g">g</option>
                <option value="ml">ml</option>
                <option value="kg">kg</option>
                <option value="l">l</option>
              </select>
            </label>
          </div>

          <button type="submit">Añadir producto</button>
        </form>
      `;

      Object.entries(categorias).forEach(([categoria, productosCategoria]) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta";
        tarjeta.innerHTML = `<h3>${categoria}</h3>`;

        productosCategoria.forEach(producto => {
          const fila = document.createElement("div");
          fila.className = "producto";

          fila.innerHTML = `
            <label class="producto-fila">
              <input
                type="checkbox"
                data-indice="${producto.indice}"
                ${producto.comprado ? "checked" : ""}
              >
              <span>
                <strong>${producto.nombre}</strong><br>
                ${producto.cantidad} ${producto.unidad}
              </span>
            </label>
          `;

          const botonEliminar = document.createElement("button");
          botonEliminar.className = "boton-peligro";
          botonEliminar.textContent = "Eliminar";

          botonEliminar.onclick = () => {
            compras[claveCompra].splice(producto.indice, 1);
            guardarDatos(CLAVE_COMPRAS, compras);
            renderizarCompra();
          };

          fila.appendChild(botonEliminar);
          tarjeta.appendChild(fila);
        });

        contenedor.appendChild(tarjeta);
      });

      document
        .getElementById("anadir-producto")
        .addEventListener("submit", evento => {
          evento.preventDefault();

          const nombre = document
            .getElementById("producto-nombre")
            .value.trim();

          const cantidad =
            Number(document.getElementById("producto-cantidad").value) || 1;

          const unidad = document
            .getElementById("producto-unidad")
            .value;

          if (!nombre) return;

          compras[claveCompra].push({
            nombre,
            cantidad,
            unidad,
            categoria: "Otros",
            comprado: false
          });

          guardarDatos(CLAVE_COMPRAS, compras);
          renderizarCompra();
        });

      contenedor
        .querySelectorAll('input[type="checkbox"]')
        .forEach(checkbox => {
          checkbox.onchange = () => {
            const indice = Number(checkbox.dataset.indice);
            compras[claveCompra][indice].comprado = checkbox.checked;
            guardarDatos(CLAVE_COMPRAS, compras);
          };
        });
    }

    document.querySelectorAll(".nav-item").forEach(enlace => {
      enlace.addEventListener("click", evento => {
        evento.preventDefault();
        mostrarPantalla(enlace.dataset.pantalla);
      });
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    mostrarPantalla("hoy");
  </script>
</body>
</html>
